<!DOCTYPE html>
<html>
<head>
    <title>Coin Flip</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #fff8e7;
            padding: 30px;
        }

        h1 {
            color: #8b4513;
        }

        input {
            padding: 10px;
            width: 100px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: #8b4513;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #coins {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 25px;
        }

        .coin {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid goldenrod;
            background-color: #ffdf70;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #704214;
        }

        #result {
            font-size: 18px;
            font-weight: bold;
            color: darkgreen;
        }

        footer {
            margin-top: 30px;
            color: gray;
        }
    </style>
</head>

<body>

    <h1>🪙 Coin Flip</h1>

    <label>Number of Coins:</label>
    <input type="number" id="number" min="1" max="30" value="5">

    <br>

    <button onclick="flipCoins()">Flip Coins</button>

    <div id="coins"></div>

    <p id="result"></p>

    <footer>
        Register Number: URK24CS9060 | BATCH 6
    </footer>

    <script>
        function flipCoins() {
            let number = parseInt(
                document.getElementById("number").value
            );

            let coins = document.getElementById("coins");
            let result = document.getElementById("result");

            coins.innerHTML = "";
            result.innerHTML = "";

            if (isNaN(number) || number < 1 || number > 30) {
                alert("Enter a number between 1 and 30.");
                return;
            }

            let heads = 0;
            let tails = 0;

            for (let i = 0; i < number; i++) {
                let coin = document.createElement("div");
                coin.className = "coin";

                if (Math.random() < 0.5) {
                    coin.innerHTML = "HEADS";
                    heads++;
                } else {
                    coin.innerHTML = "TAILS";
                    tails++;
                }

                coins.appendChild(coin);
            }

            result.innerHTML =
                "Heads: " + heads + "<br>" +
                "Tails: " + tails;
        }
    </script>

</body>
</html>
