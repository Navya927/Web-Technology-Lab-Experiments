```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Calculator App</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: white;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
        }

        h3 {
            background: black;
            color: white;
            padding: 10px;
        }

        input {
            width: 65px;
            padding: 5px;
            margin: 5px;
        }

        .percentages {
            margin: 20px 0;
        }

        button {
            background: #172c91;
            color: white;
            border: none;
            padding: 10px 18px;
            cursor: pointer;
        }

        .results {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
        }

        .box {
            color: white;
            padding: 12px;
            min-width: 75px;
            font-size: 13px;
        }

        .blue { background: blue; }
        .green { background: green; }
        .purple { background: purple; }
        .pink { background: deeppink; }
    </style>
</head>

<body>
<div class="container">

    <h3>Budget Calculator App</h3>

    <p>Enter Amount that you want to Manage</p>

    <input type="number" id="amount" value="15000"
           min="0">

    <p>How would you like to divide your money?</p>

    <div class="percentages">
        Room Rent (%) <input type="number" id="rent" value="50">
        Accessories (%) <input type="number" id="accessories" value="20">
        Emergency (%) <input type="number" id="emergency" value="20">
        Saving (%) <input type="number" id="saving" value="10">
    </div>

    <button id="evaluate">Evaluate My Money</button>

    <div class="results">
        <div class="box blue">
            Room Rent
            <h4 id="rentResult">Rs.7500</h4>
        </div>

        <div class="box green">
            Accessories
            <h4 id="accessoriesResult">Rs.3000</h4>
        </div>

        <div class="box purple">
            Emergency
            <h4 id="emergencyResult">Rs.3000</h4>
        </div>

        <div class="box pink">
            Saving
            <h4 id="savingResult">Rs.1500</h4>
        </div>
    </div>

</div>

<script>
$(document).ready(function() {

    $("#evaluate").click(function() {

        let amount = Number($("#amount").val());

        let rent = Number($("#rent").val());
        let accessories = Number($("#accessories").val());
        let emergency = Number($("#emergency").val());
        let saving = Number($("#saving").val());

        let total = rent + accessories + emergency + saving;

        if ($("#amount").val() === "" ||
            amount <= 0 ||
            [rent, accessories, emergency, saving].some(
                p => p < 0 || p > 100
            ) ||
            total !== 100) {

            alert("Please enter a valid amount and percentages totaling 100%.");
            return;
        }

        $("#rentResult").text("Rs." + amount * rent / 100);
        $("#accessoriesResult").text("Rs." + amount * accessories / 100);
        $("#emergencyResult").text("Rs." + amount * emergency / 100);
        $("#savingResult").text("Rs." + amount * saving / 100);

    });

});
</script>

</body>
</html>
