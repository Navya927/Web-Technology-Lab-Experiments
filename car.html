```html
<!DOCTYPE html>
<html>
<head>
    <title>Move Car</title>
</head>
<body onload="init()">
    <h1>Move the Car</h1>

    <img id="img"
         src="https://placehold.co/100x50?text=CAR"
         style="width:100px; position:relative; left:0px;">

    <br><br>
    <button onclick="moveRight()">Move</button>
    <button onclick="stop()">Stop</button>

    <script>
        var imgObj;
        var animate;

        function init() {
            imgObj = document.getElementById("img");
            imgObj.style.position = "relative";
            imgObj.style.left = "0px";
        }

        function moveRight() {
            imgObj.style.left =
                parseInt(imgObj.style.left) + 1 + "px";

            animate = setTimeout(moveRight, 10);
        }

        function stop() {
            clearTimeout(animate);
        }
    </script>
</body>
</html>
```
