<!DOCTYPE html>
<html>
<head>
    <title>Webpage Design Using Advanced CSS3</title>

    <style>
        body {
            margin: 20px;
            border: 2px solid black;
            font-family: Arial, sans-serif;
        }

        /* Header with multiple backgrounds */
        header {
            height: 150px;
            padding: 15px;
            background-image:
                radial-gradient(circle at 15% 40%, #ffb6c1 0 8%, transparent 9%),
                linear-gradient(to right, #0875b9, #344fbb, #0875b9);
            background-size: 100% 100%;
            color: white;
        }

        .flower {
            display: inline-block;
            width: 55px;
            height: 75px;
            margin: 8px;
            border: 5px solid;
            border-image: linear-gradient(red, yellow, green) 1;
            box-shadow: 3px 3px 5px black;
        }

        /* Navigation */
        nav {
            display: flex;
            background: #888;
        }

        nav a {
            flex: 1;
            padding: 10px;
            text-align: center;
            text-decoration: none;
            color: black;
        }

        nav a:hover {
            background: red;
            color: white;
        }

        /* Main content */
        .content {
            background: pink;
            min-height: 190px;
            padding: 10px;
        }

        table {
            margin: auto;
            width: 200px;
            border-radius: 15px;
            overflow: hidden;
            border-spacing: 0;
            text-align: center;
        }

        th {
            background: green;
            color: white;
            padding: 8px;
        }

        td {
            padding: 5px;
        }

        tr:nth-child(odd) {
            background: #aaff22;
        }

        tr:nth-child(even) {
            background: green;
            color: white;
        }

        tr:hover {
            background: yellow;
            color: black;
        }

        .itemImg {
            opacity: 0.2;
        }

        .itemName:hover + .itemImg {
            opacity: 1;
        }

        /* Login and registration section */
        .forms {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            padding: 35px 10px;
            min-height: 270px;

            background-image:
                linear-gradient(rgba(0,0,0,0.35),
                                rgba(0,0,0,0.35)),
                radial-gradient(circle, #d6e9ff, #718eb4);
            background-size: cover;
        }

        .formbox {
            width: 230px;
            padding: 18px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px #333;
        }

        h3 {
            text-align: center;
            color: #1263b4;
        }

        input {
            width: 95%;
            padding: 8px;
            margin: 7px 0 12px;
            border: 1px solid #aaa;
        }

        input:focus {
            border: 3px solid red;
            background-color: lightgreen;
            outline: none;
        }

        input:required {
            border-left: 3px solid blue;
        }

        input[type="email"]:invalid {
            color: red;
        }

        input[type="email"]:valid {
            color: blue;
        }

        button {
            width: 100%;
            padding: 10px;
            color: white;
            background: #0866e9;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }

        /* Footer */
        footer {
            background: #ffe0b2;
            padding: 15px;
            text-align: center;
            border-top: 2px solid brown;
            font-size: 14px;
        }

        @media (max-width: 550px) {
            .forms {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>

    <!-- Sign-in and Sign-up -->

        <form class="formbox">
            <h3>Sign In</h3>

            <input type="text"
                   placeholder="Enter Username / Email / Phone Number"
                   required>

            <label>Password</label>
            <input type="password"

                   required>

</body>
</html>
