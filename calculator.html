<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            text-align: center;
            padding: 40px;
        }

        .container {
            background-color: white;
            width: 400px;
            max-width: 90%;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 80%;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        #score, #type {
            color: green;
            font-weight: bold;
        }

        footer {
            margin-top: 25px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Calculate your Body Mass Index (BMI)!</h1>

        <fieldset>
            <legend>BMI Details</legend>

            Weight (in kilograms):
            <input type="number" id="weight"
                   placeholder="Enter weight in kg" step="any">
            <br>

            Height (in meters):
            <input type="number" id="height"
                   placeholder="Enter height in meters" step="any">
            <br>

            <button onclick="calculate()">Get BMI!</button>
        </fieldset>

        <p>
            Your BMI is <span id="score"></span>.
            <br><br>
            Your body type is <span id="type"></span>.
        </p>

        <footer>
            Register Number: URK24CS9060
            <br>
            BATCH 6
        </footer>

    </div>

    <script>
        function calculate() {

            // Get weight and height from input boxes
            var weight = parseFloat(
                document.getElementById("weight").value
            );

            var height = parseFloat(
                document.getElementById("height").value
            );

            // Calculate BMI
            var bmi = weight / (height * height);

            // Display BMI score
            document.getElementById("score").innerHTML =
                bmi.toFixed(2);

            // Determine body type using the PDF criteria
            var type;

            if (bmi < 18) {
                type = "Underweight";
            } else if (bmi <= 25) {
                type = "Normal";
            } else if (bmi <= 30) {
                type = "Overweight";
            } else {
                type = "Obese";
            }

            // Display body type
            document.getElementById("type").innerHTML = type;
        }
    </script>

</body>
</html>
