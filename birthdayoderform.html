<!DOCTYPE html>
<html>
<head>
    <title>Birthday Cake Order Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff0f5;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px pink;
        }

        h1 {
            color: #d63384;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        select, input {
            padding: 10px;
            width: 90%;
            margin-top: 8px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #d63384;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            color: #8b005d;
            font-size: 17px;
            line-height: 1.8;
        }

        footer {
            margin-top: 25px;
            color: gray;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🎂 Birthday Cake Order Form</h1>

        <label for="cake">Select Cake Size:</label>
        <select id="cake">
            <option value="100">0.5 kg - Rs.100</option>
            <option value="200">1 kg - Rs.200</option>
            <option value="400">2 kg - Rs.400</option>
        </select>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" min="1" value="1">

        <label for="tip">Select Tip:</label>
        <select id="tip">
            <option value="10">10%</option>
            <option value="15">15%</option>
            <option value="20">20%</option>
        </select>

        <br>

        <button onclick="calculateTotal()">Calculate Total</button>

        <div id="result"></div>
    </div>

    <footer>
        Register Number: URK24CS9060 | BATCH 6
    </footer>

    <script>
        function calculateTotal() {
            let price = parseFloat(
                document.getElementById("cake").value
            );

            let quantity = parseInt(
                document.getElementById("quantity").value
            );

            let tipRate = parseFloat(
                document.getElementById("tip").value
            );

            let result = document.getElementById("result");

            if (isNaN(quantity) || quantity < 1) {
                result.innerHTML = "Please enter a valid quantity.";
                return;
            }

            let subtotal = price * quantity;
            let tax = subtotal * 0.09;
            let tip = subtotal * tipRate / 100;
            let total = subtotal + tax + tip;

            result.innerHTML =
                "<b>Order Summary</b><br>" +
                "Cake Price: Rs. " + subtotal.toFixed(2) + "<br>" +
                "Tax (9%): Rs. " + tax.toFixed(2) + "<br>" +
                "Tip (" + tipRate + "%): Rs. " + tip.toFixed(2) + "<br>" +
                "<hr>" +
                "<b>Total Amount: Rs. " +
                total.toFixed(2) + "</b>";
        }
    </script>

</body>
</html>
